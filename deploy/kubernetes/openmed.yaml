apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tof-clinical-openmed-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tof-clinical-openmed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tof-clinical-openmed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tof-clinical-openmed
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openmed
          # Replace with the immutable registry digest built from clinical-ai/.
          image: tof-clinical-openmed:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          env:
            - {name: AI_SERVICE_TOKEN_FILE, value: /run/secrets/openmed/token}
            - {name: OPENMED_ALLOWED_HOSTS, value: "localhost,127.0.0.1,tof-clinical-openmed,tof-clinical-openmed.tof-clinical,tof-clinical-openmed.tof-clinical.svc.cluster.local"}
            - {name: OPENMED_OFFLINE, value: "1"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: HF_DATASETS_OFFLINE, value: "1"}
            - {name: HF_HUB_DISABLE_TELEMETRY, value: "1"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 20
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: credential, mountPath: /run/secrets/openmed, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: tof-clinical-openmed-models
        - name: credential
          secret:
            secretName: tof-clinical-openmed
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tof-clinical-openmed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tof-clinical-openmed
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmed-boundary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tof-clinical-openmed
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tof-clinical
      ports:
        - {protocol: TCP, port: 8081}
  # Local weights only. No database, DNS, or internet egress is required.
  egress: []
